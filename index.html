<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนที่ฐานเรียนรู้</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ซ่อนแถบเลื่อน (Scrollbar) และทำให้แผนที่เต็มจอเสมอ */
        body { margin: 0; padding: 0; background-color: #8bb381; overflow: hidden; }
        #map { width: 100vw; height: 100vh; } 
        
        /* ตกแต่งปุ่มในกรอบข้อความ */
        .popup-btn {
            display: block; text-align: center; background: #ff6b6b; 
            color: white; padding: 8px; text-decoration: none; border-radius: 5px; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. ตั้งค่าระบบแผนที่รูปภาพ
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1.5, // ปรับให้สามารถซูมออกได้มากขึ้นกรณีจอมือถือเล็ก
            maxZoom: 2
        });

        // 2. กำหนดขนาดและโหลดรูปภาพ
        var bounds = [[0, 0], [1080, 1920]]; 
        L.imageOverlay('map-image.jpg', bounds).addTo(map);

        // 3. ทำให้ภาพพอดีกับจอเสมอ (เมื่อเปิดครั้งแรก และเมื่อหมุนหน้าจอมือถือ/ย่อขยายหน้าต่าง)
        map.fitBounds(bounds);
        window.addEventListener('resize', function() {
            map.fitBounds(bounds);
        });

        // ==========================================
        // ส่วนปักหมุดฐานเรียนรู้ (แก้พิกัดตรงนี้ได้เลย)
        // ==========================================
        var marker1 = L.marker([650, 960]).addTo(map);
        marker1.bindPopup("<b>ฐานเรียนรู้ที่ 1: อาคารอำนวยการ</b><br><a href='https://www.youtube.com' target='_blank' class='popup-btn'>เข้าสู่บทเรียน</a>");

        var marker2 = L.marker([880, 1100]).addTo(map);
        marker2.bindPopup("<b>ฐานเรียนรู้ที่ 2: ระบบนิเวศน้ำ</b><br><a href='https://www.google.com' target='_blank' class='popup-btn'>เข้าสู่บทเรียน</a>");


        // ==========================================
        // โหมด Admin สำหรับนักพัฒนา (หาพิกัด)
        // ==========================================
        // ตรวจสอบลิงก์ด้านบนว่ามีคำว่า ?admin=true หรือไม่
        var urlParams = new URLSearchParams(window.location.search);
        var isAdmin = urlParams.get('admin'); 

        if (isAdmin === 'true') {
            // ถ้ารหัสตรง จะแจ้งเตือนให้แอดมินทราบว่าระบบทำงานแล้ว
            alert("✅ โหมด Admin เปิดใช้งาน: คุณสามารถคลิกบนแผนที่เพื่อหาพิกัดได้");
            
            // เปิดระบบคลิกเพื่อบอกพิกัด
            map.on('click', function(e) {
                var lat = Math.round(e.latlng.lat);
                var lng = Math.round(e.latlng.lng);
                alert("คัดลอกตัวเลขนี้ไปใช้ได้เลย:\n[" + lat + ", " + lng + "]");
            });
        }
    </script>
</body>
</html>
